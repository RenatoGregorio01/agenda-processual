name: Deploy Homelab

# Publica no servidor Ubuntu do homelab depois que API + Web passam no CI.
# Requer self-hosted runner com label `homelab` e variável HOMELAB_REPO_PATH
# apontando para o clone no Ubuntu (ex.: /home/renato/agenda-processual).
# Ver docs/homelab-deploy.md (seção CI/CD).

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api:
    name: API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  web:
    name: Web CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: ESLint
        continue-on-error: true
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.agendaprocessual.com.br
        run: npm run build

  deploy:
    name: Deploy
    needs: [api, web]
    runs-on: [self-hosted, homelab]
    steps:
      - name: Pull and rebuild stack
        env:
          HOMELAB_REPO_PATH: ${{ vars.HOMELAB_REPO_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${HOMELAB_REPO_PATH:-}" ]; then
            echo "Defina a variável de repositório HOMELAB_REPO_PATH (caminho local do clone)."
            exit 1
          fi
          cd "$HOMELAB_REPO_PATH"
          git fetch origin
          git checkout "${GITHUB_REF_NAME}"
          git pull --ff-only "origin" "${GITHUB_REF_NAME}"

          COMPOSE=(
            docker compose
            --env-file docker/homelab.env
            -f docker/docker-compose.yml
            -f docker/compose.homelab.yml
          )

          if [ -f docker/smtp.env ]; then
            COMPOSE+=(--env-file docker/smtp.env -f docker/compose.smtp.yml)
          fi

          "${COMPOSE[@]}" up -d --build

          echo "Deploy ok em ${GITHUB_REF_NAME}"
