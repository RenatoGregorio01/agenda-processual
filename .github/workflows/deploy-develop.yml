name: Deploy Develop

# Publica a branch develop na stack de homologação do homelab.
# Requer self-hosted runner `homelab` e HOMELAB_DEVELOP_REPO_PATH
# (ex.: /home/renato/agenda-processual-develop).
# Produção continua em deploy-homelab.yml (só main).
# Ver docs/homelab-deploy.md (ambiente develop).

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api:
    name: API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  web:
    name: Web CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api-develop.agendaprocessual.com.br
          NEXT_PUBLIC_APP_ENV: staging
        run: npm run build

  deploy:
    name: Deploy
    needs: [api, web]
    runs-on: [self-hosted, homelab]
    steps:
      - name: Pull and rebuild develop stack
        env:
          HOMELAB_DEVELOP_REPO_PATH: ${{ vars.HOMELAB_DEVELOP_REPO_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${HOMELAB_DEVELOP_REPO_PATH:-}" ]; then
            echo "Defina a variável HOMELAB_DEVELOP_REPO_PATH (clone de homologação no Ubuntu)."
            exit 1
          fi
          cd "$HOMELAB_DEVELOP_REPO_PATH"
          if [ ! -f docker/homelab-develop.env ]; then
            echo "Crie docker/homelab-develop.env (veja docker/homelab-develop.env.example)."
            exit 1
          fi
          git fetch origin
          git checkout develop
          git pull --ff-only origin develop

          docker compose -p agenda-develop \
            --env-file docker/homelab-develop.env \
            -f docker/docker-compose.yml \
            -f docker/compose.develop.yml \
            up -d --build

          echo "Deploy develop ok"
