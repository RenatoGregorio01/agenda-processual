# Scrape job para o Prometheus do homelab.
# Cole em prometheus.yml (scrape_configs) ou use file_sd.
#
# Se a Agenda e o Prometheus estão na mesma rede Docker:
#   targets: ["agenda-api:8000"]
# Se o Prometheus está no host e a API publica 8001:
#   targets: ["host.docker.internal:8001"]  # Docker Desktop
#   targets: ["172.17.0.1:8001"]            # Linux bridge (ajuste)

scrape_configs:
  - job_name: agenda-api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - agenda-api:8000
        labels:
          service: agenda-processual
          env: homelab
