# Scrape job para o Prometheus do homelab (gregorio-homelab).
#
# A API roda no Mac; o Prometheus no servidor Ubuntu. Preferir Tailscale:
#   targets: ["<IP_TAILSCALE_DO_MAC>:8001"]
#
# Alternativa (mesma máquina / mesma rede Docker):
#   targets: ["agenda-api:8000"]
# Alternativa host Docker Desktop:
#   targets: ["host.docker.internal:8001"]
#
# Não publique /metrics no túnel Cloudflare sem autenticação.
#
# Alertas: veja deploy/prometheus/alerts.yml (rule_files no prometheus.yml).

scrape_configs:
  - job_name: agenda-api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 100.106.204.92:8001
        labels:
          service: agenda-processual
          env: homelab
