# Scrape jobs para o Prometheus do homelab (Ubuntu).
#
# Produção e homologação entram na rede `observability`.
# Em compose/monitoring/prometheus/prometheus.yml do repo homelab, inclua os jobs abaixo.
#
# Recarregue: curl -X POST http://127.0.0.1:9090/-/reload

scrape_configs:
  - job_name: agenda-api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - agenda-api:8000
        labels:
          service: agenda-processual
          env: homelab
  - job_name: agenda-api-develop
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - agenda-develop-api:8000
        labels:
          service: agenda-processual
          env: develop
