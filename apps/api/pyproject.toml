[project]
name = "agenda-processual-api"
version = "0.1.0"
description = "API FastAPI do Agenda Processual"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "greenlet>=3.1.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.10.0",
  "bcrypt>=4.2.0",
  "email-validator>=2.2.0",
  "aiosmtplib>=3.0.0",
  "apscheduler>=3.10.4",
  "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "aiosqlite>=0.20.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e: testes end-to-end da API (ASGI + banco isolado)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
  "B008",  # FastAPI Depends() em defaults é o padrão idiomático
]
