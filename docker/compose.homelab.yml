# Override de produção no homelab (HTTPS via Cloudflare Tunnel).
#
# Pré-requisitos:
#   1. Domínio no Cloudflare
#   2. Tunnel criado no Zero Trust → Networks → Tunnels → token copiado
#   3. docker/homelab.env e (opcional) docker/smtp.env preenchidos
#
# Subir:
#   docker compose --env-file docker/homelab.env \
#     -f docker/docker-compose.yml \
#     -f docker/compose.homelab.yml \
#     -f docker/compose.smtp.yml \
#     --env-file docker/smtp.env \
#     up -d --build
#
# Rotas do túnel (Zero Trust → Public Hostname):
#   https://agendaprocessual.com.br      → http://web:3000
#   https://api.agendaprocessual.com.br  → http://api:8000
#
# NÃO publique no túnel: db, redis, mailpit.

services:
  api:
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?defina APP_PUBLIC_URL em docker/homelab.env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET forte em docker/homelab.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SEED_EXAMPLE_DATA: "false"
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      METRICS_ENABLED: "true"
      ALERTAS_ENABLED: "true"
    # Sem bind-mount nem --reload: usa a imagem buildada.
    volumes: !reset []
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    image: agenda-web:homelab
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em docker/homelab.env}
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?defina APP_PUBLIC_URL em docker/homelab.env}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em docker/homelab.env}
      API_URL: http://api:8000
    # Remove volume de código + node_modules do compose base (modo dev).
    volumes: !reset []
    # Imagem standalone: node server.js (sem next dev / badge "N").
    command: ["node", "server.js"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: agenda-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?defina TUNNEL_TOKEN em docker/homelab.env}
    depends_on:
      - api
      - web
