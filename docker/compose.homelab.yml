# Override de produção no servidor Ubuntu (homelab).
#
# Pré-requisitos:
#   1. Domínio no Cloudflare + Tunnel `agenda` com token
#   2. Rede Docker externa `observability` (Prometheus/Grafana do homelab)
#   3. docker/homelab.env e (opcional) docker/smtp.env preenchidos
#
# Subir no servidor:
#   docker compose --env-file docker/homelab.env \
#     -f docker/docker-compose.yml \
#     -f docker/compose.homelab.yml \
#     -f docker/compose.smtp.yml \
#     --env-file docker/smtp.env \
#     up -d --build
#
# Rotas do túnel (Zero Trust → Public Hostname):
#   https://agendaprocessual.com.br      → http://web:3000
#   https://api.agendaprocessual.com.br  → http://api:8000
#
# Sem publicação de portas no host (Grafana já usa :3000, Postgres do homelab :5432).
# Métricas: Prometheus scrapea agenda-api:8000 na rede `observability`.

services:
  db:
    # Dados em docker/data/postgres no clone do servidor.
    # Porta customizada via DB_PORT=5433 em docker/homelab.env (evita conflito com postgres :5432 do homelab)

  redis:
    ports: !reset []

  mailpit:
    # UI/SMTP só internos; produção real usa compose.smtp.yml.
    ports: !reset []

  api:
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?defina APP_PUBLIC_URL em docker/homelab.env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET forte em docker/homelab.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SEED_EXAMPLE_DATA: "false"
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      METRICS_ENABLED: "true"
      ALERTAS_ENABLED: "true"
      AUDIT_PURGE_ENABLED: "true"
      AUDIT_RETENTION_DAYS: "365"
      DJEN_ENABLED: "true"
      DJEN_CRON_HOUR: "7"
      DJEN_PRAZO_DIAS_UTEIS: "15"
    volumes: !reset []
    ports: !reset []
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - default
      - observability

  web:
    image: agenda-web:homelab
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em docker/homelab.env}
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?defina APP_PUBLIC_URL em docker/homelab.env}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em docker/homelab.env}
      API_URL: http://api:8000
    volumes: !reset []
    ports: !reset []
    command: ["node", "server.js"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: agenda-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?defina TUNNEL_TOKEN em docker/homelab.env}
    depends_on:
      - api
      - web

networks:
  observability:
    external: true
